name: Discovery Portal Smoke

on:
  push:
    branches: [main]
    paths:
      - "data/job_sources.json"
      - "app/sources/discovery_portal.py"
      - "app/discovery.py"
      - "app/scheduled_runner.py"
      - "tests/test_discovery_portal.py"
      - ".github/workflows/discovery-portal-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke public discovery portals
        run: |
          python - <<'PY'
          import json
          from app.sources.discovery_portal import fetch_jobs
          cfg=json.load(open("data/job_sources.json",encoding="utf-8"))
          failed=[]
          total_jobs=0
          responsive_sources=0
          for src in cfg.get("discovery_portal",[]):
              if not src.get("enabled",True):
                  continue
              try:
                  rows=fetch_jobs(src["provider"],src["search_url"],src["job_url_pattern"],timeout=15,max_detail_pages=src.get("max_detail_pages",60))
                  print(f'SMOKE {src["provider"]}: {len(rows)} DE jobs')
                  total_jobs += len(rows)
                  if rows:
                      responsive_sources += 1
                  else:
                      failed.append((src["provider"],"zero_results_or_access_restricted"))
              except Exception as exc:
                  failed.append((src["provider"],repr(exc)))
                  print(f'SMOKE_ERROR {src["provider"]}: {exc!r}')
          if failed:
              print("WARNING: Partial portal coverage (source-health monitoring will report): "+repr(failed))
          print(f"Portal smoke: {responsive_sources} source rows returned jobs, {total_jobs} raw discovery candidates")
          # A single zero-result or blocked provider must not fail the whole
          # integration smoke when other providers are healthy. Hard fail only
          # if the configured portal universe yields no candidates at all.
          if not total_jobs:
              raise SystemExit("All enabled discovery portals returned zero candidates")
          PY
