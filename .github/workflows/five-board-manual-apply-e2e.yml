name: Five Board Manual Apply E2E
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/five-board-manual-apply-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: five-board-manual-apply-e2e
  cancel-in-progress: true

jobs:
  five-board-check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies, LibreOffice and compatible PDF font
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer fonts-crosextra-carlito fontconfig
          fc-cache -f
          fc-match Calibri
      - name: Run five board integration tests
        run: |
          python -m pytest -q tests/test_approved_board_application_route.py tests/test_additional_discovery_boards.py tests/test_aggregator_requires_employer_ats.py
      - name: Execute real five-board discovery to validated manual-apply resume
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_LLM_MODEL: gpt-6.1-sol
          RESUME_LLM_SERVICE_TIER: flex
          RESUME_LLM_REASONING_EFFORT: medium
          RESUME_LLM_MAX_OUTPUT_TOKENS: "8000"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from app.production_cycle import run_cycle
          from app.production_acceptance import audit
          source_config=json.loads(Path("data/job_sources.json").read_text())
          keep={"yc_jobs","wellfound","welcome_to_the_jungle"}
          cfg={
              "hiringcafe":source_config["hiringcafe"],
              "himalayas":{**source_config["himalayas"],"max_pages":1},
              "discovery_portal":[{**r,"max_detail_pages":min(60,int(r.get("max_detail_pages",60)))}
                                  for r in source_config["discovery_portal"]
                                  if r.get("enabled") and r.get("provider") in keep]
          }
          Path("generated").mkdir(exist_ok=True)
          Path("generated/five_board_sources.json").write_text(json.dumps(cfg,indent=2))
          summary=run_cycle(
              sources="generated/five_board_sources.json",
              ledger="generated/five_board_isolated_ledger.json",
              hours=24,generate_resumes=True,limit=1
          )
          accepted=audit(summary["eligible_report"].replace("_eligible.json","_summary.json"))
          f=json.loads(Path(summary["finalized_report"]).read_text())
          holds=Counter((x.get("action"),(x.get("job") or {}).get("source"))
                        for x in f.get("rejections",[]))
          prepared=[]
          if summary.get("manifest"):
              manifest_file=Path(summary["manifest"])
              if manifest_file.exists():
                  prepared=[{
                      "source":x.get("source"),"company":x.get("company"),
                      "title":x.get("title"),"next_action":x.get("next_action"),
                      "application_route":x.get("application_route"),
                      "posting_verification_scope":x.get("posting_verification_scope"),
                      "resume_validated":(x.get("artifact_validation") or {}).get("passed"),
                      "ats_score":(x.get("ats_audit") or {}).get("internal_ats_score")
                  } for x in json.loads(manifest_file.read_text())]
          info={
              "discovered":summary["discovered"],"preliminary_eligible":summary["preliminary_eligible"],
              "final_jd_verified":summary["final_jd_verified"],"resumes_prepared":summary["prepared"],
              "ready_to_apply":summary["ready_to_apply"],
              "source_status":summary.get("source_status"),"source_errors":summary.get("source_errors"),
              "rejections":{str(k):v for k,v in holds.items()},
              "prepared_resumes":prepared,"acceptance_passed":accepted.get("passed")
          }
          Path("generated/five_board_results.json").write_text(json.dumps(info,indent=2))
          print("FIVE_BOARD_E2E_RESULTS="+json.dumps(info,sort_keys=True),flush=True)
          for name in ("hiringcafe","himalayas","yc_jobs","wellfound","welcome_to_the_jungle"):
              if name not in summary.get("source_status",{}):
                  raise SystemExit("Missing board collector "+name)
          if not accepted.get("passed"):
              raise SystemExit("Production acceptance rejected board application queue")
          if summary["final_jd_verified"]==0:
              print("WARNING: No live eligible board listing passed all post-date/JD/live checks; the run still verified the handoff.",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-board-manual-apply-e2e-diagnostics
          path: |
            generated/five_board_results.json
            generated/cycles/*_summary.json
            generated/cycles/*_summary_acceptance.json
            generated/cycles/*_finalized.json
            generated/cycles/*_manifest.json
            generated/cycles/*_application_queue.json
          retention-days: 7
          if-no-files-found: ignore
