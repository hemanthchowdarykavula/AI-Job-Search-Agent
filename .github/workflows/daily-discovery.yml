name: Two-Hour Production Job Cycle
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run the production cycle immediately for a controlled cloud test"
        required: false
        default: false
        type: boolean
      scheduled_slot:
        description: "Optional exact Eastern weekday slot (YYYY-MM-DDTHH:MM), for future scheduler deployments"
        required: false
        type: string

concurrency:
  group: production-job-cycle
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scheduler, ledger, discovery and source-health state
        uses: actions/cache@v4
        with:
          path: |
            generated/
            state/
          key: job-agent-state-${{ github.run_id }}
          restore-keys: job-agent-state-

      - name: Decide whether a production slot is due
        id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_RUN: ${{ inputs.force }}
          REQUESTED_SLOT: ${{ inputs.scheduled_slot }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          from app.schedule_slots import (
              slot_already_completed, slot_from_dispatch, validate_accepted_slot,
          )

          eastern = ZoneInfo("America/New_York")
          now = datetime.now(eastern)
          force = os.environ.get("FORCE_RUN", "").lower() == "true"
          explicit_slot = os.environ.get("REQUESTED_SLOT", "").strip()
          state_path = Path("generated/scheduler_state.json")
          try:
              state = json.loads(state_path.read_text()) if state_path.exists() else {}
          except (OSError, ValueError):
              state = {}

          dispatch_created_at = None
          if force:
              slot = now.strftime("%Y-%m-%dT%H:%M")
          elif explicit_slot:
              slot = validate_accepted_slot(explicit_slot, now)
              if slot is None:
                  raise ValueError(f"Invalid or stale scheduled_slot: {explicit_slot}")
          else:
              # The runner can start over 50 minutes after the workflow was
              # dispatched. Query its immutable creation timestamp instead of
              # checking whether the *current* wall clock is still in-window.
              url = (
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              )
              request = Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ai-job-search-scheduler-guard",
              })
              for attempt in range(3):
                  try:
                      with urlopen(request, timeout=20) as response:
                          dispatch_created_at = json.load(response)["created_at"]
                      break
                  except Exception as exc:
                      if attempt == 2:
                          raise RuntimeError(
                              "Cannot verify original GitHub dispatch time; failing instead of silently skipping discovery."
                          ) from exc
                      time.sleep(2 * (attempt + 1))
              dispatched = datetime.fromisoformat(dispatch_created_at.replace("Z", "+00:00"))
              selected = slot_from_dispatch(dispatched)
              slot = validate_accepted_slot(selected, now) if selected else None

          last_completed = state.get("last_completed_slot")
          due = force or (
              slot is not None and not slot_already_completed(last_completed, slot)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if due else 'false'}\n")
              f.write(f"slot={slot or ''}\n")
          explanation = (
              f"Dispatch created at: {dispatch_created_at or '(explicit/manual)'}; "
              f"runner Eastern time: {now.isoformat()}; accepted slot: {slot}; "
              f"last completed: {last_completed}; should_run={due}"
          )
          print(explanation)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Production scheduling decision\n\n" + explanation + "\n\n")
          PY

      - name: Stop heartbeat when no slot is due
        if: steps.guard.outputs.should_run != 'true'
        run: echo "No production slot is due; heartbeat exits successfully."

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.guard.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Install LibreOffice and Calibri-compatible PDF font
        if: steps.guard.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito fontconfig
          fc-cache -f
          soffice --version
          echo "Calibri font resolution:"
          fc-match Calibri
          fc-match Calibri | grep -Ei 'Calibri|Carlito'

      # Employer-universe enrichment is intentionally NOT part of this critical
      # production path. It performs thousands of external network probes and can
      # take far longer than a two-hour job slot. Run the dedicated
      # employer-universe-enrichment workflow independently; production consumes
      # the latest persisted company/source registry without waiting for enrichment.

      - name: Audit configured source health
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m app.source_health --sources data/job_sources.json --output state/source_health.json

      - name: Run scheduled production cycle
        if: steps.guard.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_LLM_MODEL: gpt-6.1-sol
          RESUME_LLM_SERVICE_TIER: flex
          RESUME_LLM_REASONING_EFFORT: medium
          RESUME_LLM_MAX_OUTPUT_TOKENS: "8000"
        run: |
          FORCE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python -m app.scheduled_runner --sources data/job_sources.json --accepted-slot "${{ steps.guard.outputs.slot }}" $FORCE_ARG

      - name: Generate exhaustive source execution report
        if: steps.guard.outputs.should_run == 'true'
        run: |
          REPORT_PATH=$(python -m app.run_report)
          echo "Source report: $REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production acceptance invariants
        if: steps.guard.outputs.should_run == 'true'
        run: python -m app.production_acceptance

      - name: Repair failed source mappings for the next cycle
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python -m app.source_repair --limit 20

      - name: Sync application queue to hosted dashboard
        if: steps.guard.outputs.should_run == 'true'
        env:
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
          DASHBOARD_SYNC_URL: https://job-dashboard-production-7436.up.railway.app/api/sync
        run: |
          if [ -z "$DASHBOARD_SYNC_TOKEN" ]; then
            echo "DASHBOARD_SYNC_TOKEN is not configured; skipping dashboard sync."
          else
            # Build a dashboard-only payload. Large eligible/finalized discovery
            # reports remain in the GitHub cache/artifact and must never consume
            # the small Railway dashboard volume.
            rm -rf dashboard-sync
            mkdir -p dashboard-sync/generated/cycles

            if [ -f generated/job_ledger.json ]; then
              cp generated/job_ledger.json dashboard-sync/generated/job_ledger.json
            fi
            if [ -d generated/resumes ]; then
              cp -a generated/resumes dashboard-sync/generated/resumes
            fi
            if [ -d generated/cycles ]; then
              shopt -s nullglob
              for file in \
                generated/cycles/*_summary.json \
                generated/cycles/*_summary_acceptance.json \
                generated/cycles/*_manifest.json \
                generated/cycles/*_application_queue.json; do
                cp "$file" dashboard-sync/generated/cycles/
              done
              shopt -u nullglob
            fi

            if [ ! -f dashboard-sync/generated/job_ledger.json ] && \
               [ ! -d dashboard-sync/generated/resumes ] && \
               [ -z "$(find dashboard-sync/generated/cycles -type f -print -quit)" ]; then
              echo "No dashboard state exists to sync."
            else
              tar -czf dashboard-sync.tgz -C dashboard-sync generated
              synced=false
              for attempt in $(seq 1 12); do
                status=$(curl --show-error --silent \
                  -o dashboard-sync-response.txt \
                  -w "%{http_code}" \
                  -X POST \
                  -H "X-Dashboard-Token: $DASHBOARD_SYNC_TOKEN" \
                  -H "Content-Type: application/gzip" \
                  --data-binary @dashboard-sync.tgz \
                  "$DASHBOARD_SYNC_URL" || true)
                if [[ "$status" =~ ^2 ]]; then
                  echo "Hosted dashboard sync succeeded on attempt $attempt."
                  cat dashboard-sync-response.txt || true
                  synced=true
                  break
                fi
                echo "Dashboard sync attempt $attempt/12 returned HTTP $status; Railway may be transitioning deployments."
                if [ "$attempt" -lt 12 ]; then sleep 10; fi
              done
              if [ "$synced" != "true" ]; then
                echo "::warning::Hosted dashboard sync failed after 12 attempts. Production discovery and resume processing completed successfully; dashboard publishing can recover on the next run."
              fi
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          name: job-cycle-${{ github.run_number }}
          path: |
            generated/
            state/
          if-no-files-found: warn
          retention-days: 30
